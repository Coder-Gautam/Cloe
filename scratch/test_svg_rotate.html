<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Master SVG Wheel Test</title>
  <style>
    body {
      background: #14213D;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .wheel-wrap {
      width: 520px;
      height: 520px;
    }
    .wheel-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .svg-wheel-pod {
      transition: filter 0.3s ease;
    }
    .svg-wheel-pod.active {
      filter: url(#pod-gold-glow);
    }
  </style>
</head>
<body>
  <div class="wheel-wrap">
    <object type="image/svg+xml" data="../assets/images/wheel-elements/master-5p-wheel.svg" id="wheel-svg-obj" width="520" height="520"></object>
  </div>
</body>
</html>
